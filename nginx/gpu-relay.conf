# GPU 서버 JupyterLab 중계 — gpu-relay 컨테이너 (2026-10-01, 랩탑 ClaudeCode)
#
#   인터넷 --HTTPS--> Tailscale Funnel :10000 (TLS 종단, tailscaled)
#            --> 127.0.0.1:10080 (이 컨테이너)
#            --> 210.125.70.71:31355 (GPU 서버 NodePort, 팀원 JupyterLab — 인증은 JupyterLab 자체 로그인)
#
#   · JupyterLab 기준 경로가 / 라서 하위 경로(/gpu/)가 아니라 별도 포트(Funnel 10000)로 공개한다.
#   · 커널 연결은 WebSocket 이라 Upgrade 헤더를 넘긴다. Host 는 받은 그대로 넘긴다
#     (JupyterLab 이 WebSocket 의 Origin 과 Host 를 비교하므로 Host 를 바꾸면 커널이 안 붙는다).
#   · 로그의 host/xfh 는 tailscaled 가 Host 를 그대로 넘기는지 확인하는 용도.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format gpu_relay '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'host="$http_host" xfh="$http_x_forwarded_host" xff="$http_x_forwarded_for" rt=$request_time';

server {
    listen 10080;
    server_name _;
    access_log /dev/stdout gpu_relay;

    client_max_body_size 100m;   # JupyterLab 파일 업로드(큰 파일은 조각으로 나눠 올림)

    # AI 리포트 결과 창구는 닫았다(2026-10-07 사용자 결정, 계획서 AI리포트 v4 §15·§16): 리포트는 젯슨이 직접 작성하고
    #   GPU 서버 LLM 은 추론만 빌려준다 → GPU 서버가 젯슨으로 결과를 보낼 일이 없다. 인증 파일·중계 키·반복 시도 제한은 지웠다.
    #   블록은 404 로 남긴다 — 지우면 /report/ 가 아래 location / (JupyterLab)으로 넘어간다.
    location ^~ /report/ {
        return 404;
    }

    location / {
        proxy_pass http://210.125.70.71:31355;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }
}
