
# ── 80: jetson-gpu.duckdns.org → 젯슨 JupyterLab (2026-11-06, 랩탑 ClaudeCode) ──────────────
# 경로: 이 블록 → 호스트 socat(172.18.0.1:18888) → Tailscale → 젯슨 100.96.221.46:8888
# server_name 정확 일치가 위의 catch-all(listen 80, server_name _)보다 우선한다.
# 평문 HTTP — 주피터 토큰이 평문으로 지나간다. HTTPS 전환은 certbot webroot 로 가능(아래 acme 위치 준비됨).
server {
    listen 80;
    server_name jetson-gpu.duckdns.org;

    # 나중에 HTTPS 로 올릴 때 certbot webroot 검증용(지금은 무해)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    client_max_body_size 500m;   # 노트북·데이터 업로드

    location / {
        proxy_pass http://172.18.0.1:18888;
        proxy_http_version 1.1;
        # JupyterLab 커널 통신은 웹소켓 — Upgrade 헤더를 그대로 넘긴다
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
    }
}
