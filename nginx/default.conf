# /data/nginx/default.conf — 스마트큐브 고객용 웹 UI(fr 정적 빌드) + api 프록시, 네이버 클라우드판 (2026-10-19, 랩탑 ClaudeCode)
#
# 젯슨판(config/nginx/default.conf)에서 바뀐 것:
#   · Tailscale Funnel 이 하던 TLS 종단을 여기서 한다 — 443 ssl 서버 블록, Let's Encrypt 인증서(/etc/letsencrypt, 읽기 전용 마운트)
#   · 80 은 인증서 발급·갱신 검증(/.well-known/acme-challenge/ → /var/www/certbot)과 https 리다이렉트만
#   · location 블록(화면 · /api/ · /i/<iid>/api/ · /influx/ 허용 목록)은 젯슨판 그대로
# 장치 MQTT 8443 은 http 가 아니라 nginx.conf 의 stream 블록에 있다.

# ── 80: ACME 검증 + https 리다이렉트 ───────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # certbot(webroot 방식)이 여기에 검증 파일을 쓴다: 호스트 /data/certbot-www → 컨테이너 /var/www/certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443: 화면 · api · 카메라 업로드 · InfluxDB 읽기 창구 ─────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name smartcubens.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/smartcubens.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartcubens.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;     # 카메라 펌웨어(ESP32, mbedTLS)의 사진 업로드도 이 블록으로 온다
    ssl_session_cache   shared:WEB_SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 단일 페이지 앱: 알 수 없는 경로(/, /i/jetson-01/ …)는 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 빌드 자산은 오래 캐시
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # AI 리포트 결과 창구(/api/report/)는 닫혀 있다(2026-10-06 결정 R-13, 0.9.0 에는 라우트 자체가 없다)
    location ^~ /api/report/ {
        return 404;
    }

    # 전역 라우트: /api/health, /api/me, /api/claim → api:8000/health …
    # api 컨테이너를 다시 만들면 내부 IP 가 바뀌므로 도커 내부 DNS 로 10초마다 다시 푸는 변수 upstream(젯슨판과 동일)
    location /api/ {
        client_max_body_size 8m;   # 카메라 스냅샷 업로드(/api/dev/snapshots). 기본 1MB 로는 2048x1536 JPEG 가 막힌다
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Report-Relay    "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # 인스턴스 라우트: /i/<iid>/api/cubes → api:8000/i/<iid>/cubes  (인스턴스 ID 는 소문자·숫자·-·_)
    # ★ 정규식에 중괄호가 있으면 반드시 따옴표로 감싼다 — 안 감싸면 nginx 가 { 를 블록으로 읽어 이 location 이 통째로 사라진다
    location ~ "^/i/([a-z0-9][a-z0-9_-]{0,63})/api/(.*)$" {
        client_max_body_size 8m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        set $iid $1;
        set $rest $2;
        rewrite ^ /i/$iid/$rest break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Report-Relay    "";

        # SSE(/cubes/{sn}/stream): 버퍼링을 끄고 오래 열어 둔다
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # InfluxDB 읽기 전용 공개 창구(2026-10-16 결정): /influx/ → influxdb:8086, 조회 엔드포인트만 허용(허용 목록 밖은 404)
    #   클라이언트 URL = https://smartcubens.duckdns.org/influx  (뒤에 /api/v2/query 를 붙인다), 토큰은 public-read
    location /influx/ {
        return 404;
    }
    location ~ "^/influx/(api/v2/query|api/v2/buckets|api/v2/orgs|query|health|ping)$" {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $influx_upstream http://influxdb:8086;
        set $influx_path $1;
        rewrite ^ /$influx_path break;
        proxy_pass $influx_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }
}

# ── jetson-gpu.duckdns.org → 젯슨 JupyterLab (2026-11-06 HTTPS판, 랩탑 ClaudeCode) ──────────
# 80: ACME 검증 + https 리다이렉트 / 443: TLS 종단 → 호스트 socat(172.18.0.1:18888) → Tailscale → 젯슨 8888
# 인증서 만료 ~2027-02 초, 서버 종료(12-16) 전 갱신 불필요.
server {
    listen 80;
    server_name jetson-gpu.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jetson-gpu.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/jetson-gpu.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jetson-gpu.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:JGPU_SSL:1m;

    client_max_body_size 500m;   # 노트북·데이터 업로드

    location / {
        proxy_pass http://172.18.0.1:18888;
        proxy_http_version 1.1;
        # JupyterLab 커널 통신(웹소켓 → wss)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
    }
}
