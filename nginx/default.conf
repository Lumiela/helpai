# 스마트큐브 고객용 웹 UI (fr 정적 빌드) — /data/web 서비스
# 2026-09-29 오후: 다중 인스턴스. 화면은 /i/<인스턴스ID>/ 아래에서도 같은 SPA, api 는 /i/<인스턴스ID>/api/ → api:8000/i/<인스턴스ID>/
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 단일 페이지 앱: 알 수 없는 경로(/, /i/jetson-01/ …)는 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 빌드 자산은 오래 캐시
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # API 프록시
    #
    # 2026-09-23: api 컨테이너를 다시 만들면 내부 IP가 바뀌는데, 고정 proxy_pass 는
    # nginx 가 시작할 때 한 번 푼 주소를 계속 써서 502 가 났다(09-22 19:09 재생성 뒤 밤새 장애).
    # 도커 내부 DNS(127.0.0.11)로 10초마다 다시 풀도록 변수 upstream 을 쓴다.
    # 변수 proxy_pass 는 접두어를 자동으로 떼지 않으므로 rewrite 로 뗀다.
    #
    # AI 리포트 결과 창구(/report/…)는 Funnel 10000 의 gpu-relay(Basic 인증)로만 받는다(2026-10-06, 계획서 리포트창구 v2 R-13).
    # 443 쪽 /api/report/ 로 같은 api 라우트에 닿지 못하게 막는다. (^~ 라서 아래 정규식 location 보다 먼저 결정된다)
    location ^~ /api/report/ {
        return 404;
    }

    # 전역 라우트: /api/health, /api/me, /api/claim → api:8000/health …
    location /api/ {
        client_max_body_size 8m;   # 2026-09-29 카메라 스냅샷 업로드(/api/dev/snapshots). 기본 1MB 로는 2048x1536 JPEG 가 막힌다
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Report-Relay    "";     # 리포트 중계 확인 헤더는 443 에서 받은 값을 넘기지 않는다(10-06)

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # 인스턴스 라우트: /i/<iid>/api/cubes → api:8000/i/<iid>/cubes  (인스턴스 ID 는 소문자·숫자·-·_)
    # ★ 정규식에 중괄호가 있으면 반드시 따옴표로 감싼다 — 안 감싸면 nginx 가 { 를 블록으로 읽어 이 location 이 통째로 사라진다
    #   (09-29 12:55 겪음: nginx -t 는 통과했는데 -T 에 이 블록이 없었다)
    location ~ "^/i/([a-z0-9][a-z0-9_-]{0,63})/api/(.*)$" {
        client_max_body_size 8m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        set $iid $1;
        set $rest $2;
        rewrite ^ /i/$iid/$rest break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Report-Relay    "";     # 리포트 중계 확인 헤더는 443 에서 받은 값을 넘기지 않는다(10-06)

        # SSE(/cubes/{sn}/stream): 버퍼링을 끄고 오래 열어 둔다
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }
}
