# /data/nginx/nginx.conf — web 컨테이너(nginx:1.27-alpine)의 최상위 설정, 네이버 클라우드판 (2026-10-19, 랩탑 ClaudeCode)
#
# 공식 이미지의 기본 nginx.conf 에 stream 블록만 더한 것이다. stream 은 http 밖(최상위)에만 둘 수 있어
# conf.d/default.conf(http 서버)와 별도로 이 파일을 통째로 마운트한다.
#
#   인터넷 --TLS 8443--> [stream] --평문 1883--> mosquitto (컨테이너 내부망)   ← Tailscale Funnel 의 "TLS 종단 TCP 8443" 대체
#   인터넷 --HTTPS 443--> [http: conf.d/default.conf] --> 화면 · api:8000 · influxdb:8086

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    # mosquitto 컨테이너를 다시 만들면 내부 IP 가 바뀐다. 고정 proxy_pass 는 시작 때 푼 주소를 계속 쓰므로(09-22 web 장애와 같은 문제)
    # 도커 내부 DNS 로 10초마다 다시 풀도록 변수 upstream 을 쓴다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format mqtt '$remote_addr [$time_local] $protocol $status sent=$bytes_sent recv=$bytes_received t=$session_time';
    access_log /var/log/nginx/access.log mqtt;

    server {
        listen 8443 ssl;

        ssl_certificate     /etc/letsencrypt/live/smartcubens.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/smartcubens.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;     # ESP32(mbedTLS)는 TLS 1.2
        ssl_session_cache   shared:MQTT_SSL:1m;

        set $mqtt_upstream mosquitto:1883;
        proxy_pass $mqtt_upstream;

        proxy_connect_timeout 10s;
        # 양쪽 다 조용한 시간이 이 값을 넘으면 연결을 끊는다. 장치 MQTT keepalive(15~60초)보다 충분히 길게.
        proxy_timeout 900s;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
