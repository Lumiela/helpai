
# ── jetson-gpu.duckdns.org → 젯슨 JupyterLab (2026-11-06 HTTPS판, 랩탑 ClaudeCode) ──────────
# 80: ACME 검증 + https 리다이렉트 / 443: TLS 종단 → 호스트 socat(172.18.0.1:18888) → Tailscale → 젯슨 8888
# 인증서 만료 ~2027-02 초, 서버 종료(12-16) 전 갱신 불필요.
server {
    listen 80;
    server_name jetson-gpu.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jetson-gpu.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/jetson-gpu.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jetson-gpu.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:JGPU_SSL:1m;

    client_max_body_size 500m;   # 노트북·데이터 업로드

    location / {
        proxy_pass http://172.18.0.1:18888;
        proxy_http_version 1.1;
        # JupyterLab 커널 통신(웹소켓 → wss)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
    }
}
