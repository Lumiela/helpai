# 결정 모델 질문 정의 — 학습(데이터셋)과 추론(rules 엔진)이 이 파일 하나를 같이 쓴다.
# ★ 한 글자라도 바꾸면 해시가 바뀐다 → 이전에 학습한 묶음은 rules 가 자동으로 shadow(기록만)로 내린다. 바꾼 뒤에는 재학습.
# 선택지 이름은 뜻이 드러나게 짓는다(모델이 정의 문장보다 선택지 이름을 따라가는 경향, arXiv 2609.26758).
# criteria 설명은 짧게 — 선택지마다 머리(head) 토큰 예산이 (256 - 16) // 선택지 수 이다.
version: 1

questions:
  fan_level:
    type: choice
    instructions: >-
      Choose the exhaust fan level for a rose grow cube from the readings.
      Critical heat or high humidity needs strong airflow; cold needs the fan off.
    criteria:
      "off": "cold below min, keep heat in"
      low: "comfortable or slightly warm, idle airflow"
      mid: "warm, high humidity, or ventilation window"
      high: "very warm, hot above max, or critical heat"

  light_action:
    type: choice
    instructions: >-
      Choose what to do with the grow LED now.
      Respect night, critical heat and cold protection before lux targets.
    criteria:
      "off": "night and not cold, lights must be off"
      decrease: "lux above max, or critical heat with LED above 30"
      hold: "lux in range, or LED already at its limit"
      increase: "lux below min, or cold and LED below max"

  irrigate_now:
    type: noul
    instructions: >-
      Should the pump give one short watering pulse now?
      Only if soil is below min, the sensor is calibrated, the interval has passed
      and the daily limit is not reached.
    criteria:
      "true": "soil below min and every watering condition allows it"
      "false": "soil fine, sensor not calibrated, interval not passed, limit reached, or soil missing"

  plant_stress:
    type: choice
    instructions: >-
      Rate the current stress on the roses from temperature, humidity, light and soil.
    criteria:
      none: "all readings in range"
      mild: "humidity out of range or light below min with LED at max"
      moderate: "temperature outside min or max, or dry soil that cannot be watered"
      severe: "critical heat, or temperature far outside range"

  data_suspect:
    type: noul
    instructions: >-
      Do the readings look like a sensor or wiring fault rather than real conditions?
    criteria:
      "true": "stale data, value stuck for 30 min, no rise after watering, or LED high but lux very low"
      "false": "readings are fresh and consistent"
