# 결정 모델 질문 정의 — 학습(데이터셋)과 추론(젯슨 제어기)이 이 파일 하나를 같이 쓴다.
# 기준 = 서버 api 의 autoctl 규칙 (docs/05). 정답은 helpai_decide/labeler.py.
# ★ 한 글자라도 바꾸면 해시가 바뀐다 → 이전에 학습한 묶음은 자동으로 shadow(기록만)로 내려간다. 바꾼 뒤에는 재학습.
# 선택지 이름은 뜻이 드러나게 짓는다(모델이 정의 문장보다 선택지 이름을 따라가는 경향, arXiv 2609.26758).
# criteria 설명은 짧게 — 선택지마다 머리(head) 토큰 예산이 (256 - 16) // 선택지 수 이다.
version: 2

questions:
  fan_action:
    type: choice
    instructions: >-
      Decide how the exhaust fan level (off, low, mid, high) should change now.
      Temperature rules come before humidity rules.
    criteria:
      "off": "temperature or humidity below min, and the fan is not already off"
      down: "temperature at least 1.0 below max and humidity at least 5 below max: one level lower"
      hold: "no change needed, or already at the lowest or highest level"
      up: "temperature or humidity above max: one level higher"

  light_action:
    type: choice
    instructions: >-
      Decide what to do with the grow LED now. At night the LED is off;
      in daytime it moves 10 percent toward the lux target.
    criteria:
      "off": "night: LED must be off"
      decrease: "daytime, lux above max and LED above 0"
      hold: "lux in range, lux missing, or LED already at its limit"
      increase: "daytime, lux below min and LED below 100"

  irrigate_now:
    type: noul
    instructions: >-
      Should the pump give one 5 second watering pulse now?
    criteria:
      "true": "soil below min, sensor calibrated, 60 min wait passed, fewer than 4 pulses today, pump not running"
      "false": "any watering condition fails, or soil reading missing or calibration unknown"

  plant_stress:
    type: choice
    instructions: >-
      Rate the current stress on the roses from temperature, humidity, light and soil.
    criteria:
      none: "all readings in range"
      mild: "humidity out of range, soil above max, or lux out of range with LED at its limit"
      moderate: "temperature out of range, or dry soil with no pulses left today"
      severe: "temperature more than 3 C outside the range"

  data_suspect:
    type: noul
    instructions: >-
      Do the readings look like a sensor, wiring or reporting fault rather than real conditions?
    criteria:
      "true": "stale report, missing reading, value stuck 30 min, no rise after watering, or LED high but lux very low"
      "false": "readings are fresh and consistent"
