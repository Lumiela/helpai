# /data/nginx/default.conf 의 주석 한 줄
#     # location /api/ { proxy_pass http://api:8000/; }
# 을 아래 블록으로 바꾼다. ★ 인증을 붙이기 전에는 풀지 말 것 — Funnel 443 을 타고
# 인터넷에 그대로 공개된다(사용자 결정: 지금은 인증 없음, 내부 시험만).
#
# 적용:  docker exec web nginx -t && docker exec web nginx -s reload

    location /api/ {
        # 끝의 / 때문에 /api 접두어가 떼어져 넘어간다: /api/health → api:8000/health
        proxy_pass http://api:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE(/cubes/{sn}/stream): 버퍼링을 끄고 오래 열어 둔다
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }
