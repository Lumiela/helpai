# AWS 시험 서버 자동 반영 신호 (2026-11-26, 랩탑 ClaudeCode)
# 이 파일은 langgraph 브랜치의 .github/workflows/aws-deploy-signal.yml 로 둔다.
# langgraph 브랜치에 푸시하면 AWS 에 "저장소를 다시 확인하라"는 신호만 보낸다. 비밀값을 쓰지 않고, 저장소 권한도 받지 않는다.
# 실제로 받아서 시험·반영하는 일은 AWS 가 직접 저장소를 읽어서 한다.
name: aws-deploy-signal

on:
  push:
    branches: [langgraph]
  workflow_dispatch:

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: AWS 에 신호 보내기
        run: curl -fsS -m 20 --retry 3 --retry-all-errors -X POST https://smartcubeaws.duckdns.org/hooks/aws-deploy
