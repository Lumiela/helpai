# /data/mosquitto/config/mosquitto.conf — 젯슨 현행 (2026-09-29 오후, 동적 보안 플러그인)
#
# 2026-09-29 사용자 결정: 브로커 계정은 인스턴스당 하나, api(게이트웨이)가 자동 생성.
#   password_file → mosquitto 2 내장 dynamic-security 플러그인으로 교체.
#   계정·역할·ACL 은 /mosquitto/config/dynamic-security.json (플러그인이 관리, 손으로 고치지 않는다).
#   admin = smartcube(api), 장치 계정 = 인스턴스 ID(역할 inst-<iid>: 자기 큐브 토픽만), 옛 cube001 은 inst-jetson-01 역할.
#   적용 절차: deploy/broker_dynsec_migrate.sh (한 번). 되돌리기: 백업 폴더의 mosquitto.conf + passwd.
listener 1883
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
