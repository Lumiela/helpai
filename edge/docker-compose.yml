# 젯슨(현장 엣지) 전용 compose — 서버(네이버 클라우드, backend 브랜치)의 compose 와 섞지 않는다.
# 젯슨에서:  이 edge/ 폴더를 /data/edge/ 로 복사 → /data/edge/.env 에 LAYA_API_KEY=… → 
#            cd /data/edge && docker compose up -d --build
# 묶음: /data/laya/models/<revision>/ + current 링크(상대 링크)  — manual/03_젯슨_배포_매뉴얼.md
# 나중에 rules(규칙 엔진 + PolicyGate)도 이 파일에 같이 둔다 → 같은 망에서 http://laya-edge:8000 으로 부른다.

services:
  laya-edge:
    build: .
    image: helpai-laya-edge:1
    container_name: laya-edge
    restart: unless-stopped
    environment:
      LAYA_MODEL_DIR: /models/current
      LAYA_API_KEY: ${LAYA_API_KEY:?/data/edge/.env 에 LAYA_API_KEY 가 필요하다}
      LAYA_THREADS: "3"
    volumes:
      - /data/laya/models:/models:ro       # NVMe. <revision>/ 폴더들 + current 링크
    mem_limit: 1500m                       # 넘치면 이 컨테이너만 죽는다
    cpus: "3"                              # Carmel 6 코어 중 절반
    ports:
      - "127.0.0.1:8000:8000"              # 젯슨 자기 자신에서만(점검용). 바깥에 열지 않는다
