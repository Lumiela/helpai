<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1230" viewBox="0 0 1720 1230" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect x="0" y="0" width="1720" height="1230" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="860" y="52" font-size="34" font-weight="bold" text-anchor="middle" fill="#111">스마트큐브 제어기 — RS485 토양 7종 센서 배선도</text>
  <text x="860" y="88" font-size="22" text-anchor="middle" fill="#555">2026-10-12 · 펌웨어 cube-devkit-1.3.0 (esp32_devkit_node_test) · 사용자 결정: UART2 TX GPIO17 / RX GPIO27</text>

  <!-- ===== ESP32 DevKitC ===== -->
  <rect x="60" y="140" width="400" height="560" rx="14" fill="#eef3fb" stroke="#2b4c7e" stroke-width="3"/>
  <text x="260" y="182" font-size="28" font-weight="bold" text-anchor="middle" fill="#1c3557">ESP32 DevKitC</text>
  <text x="260" y="212" font-size="22" text-anchor="middle" fill="#1c3557">WROOM-32D · "ESP32 Dev Module"</text>

  <text x="80" y="256" font-size="19" fill="#777">다른 핀 (이미 사용 중, 손대지 않음):</text>
  <text x="80" y="284" font-size="19" fill="#777">18 모터 · 16 LED</text>
  <text x="80" y="312" font-size="19" fill="#777">25·26·34 팬 (릴레이·PWM·TACH)</text>
  <text x="80" y="340" font-size="19" fill="#777">21/22 I2C (센서 4종)</text>

  <!-- 우측 핀: GPIO17, GPIO27 -->
  <circle cx="460" cy="420" r="8" fill="#1f5fbf"/>
  <text x="440" y="428" font-size="24" font-weight="bold" text-anchor="end" fill="#1f5fbf">GPIO17 · UART2 TX</text>
  <circle cx="460" cy="500" r="8" fill="#d9731a"/>
  <text x="440" y="508" font-size="24" font-weight="bold" text-anchor="end" fill="#d9731a">GPIO27 · UART2 RX</text>
  <text x="440" y="536" font-size="18" text-anchor="end" fill="#777">(10-06 TACH 이동으로 비어 있던 핀)</text>

  <!-- 하단 핀: 5V, GND -->
  <circle cx="200" cy="700" r="8" fill="#c62828"/>
  <text x="200" y="680" font-size="24" font-weight="bold" text-anchor="middle" fill="#c62828">5V (VIN)</text>
  <circle cx="320" cy="700" r="8" fill="#222"/>
  <text x="320" y="680" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">GND</text>
  <text x="260" y="648" font-size="18" text-anchor="middle" fill="#777">3V3 핀은 이 배선에서 쓰지 않음</text>

  <!-- ===== GPIO17 → 모듈 RXD (3.3V 직결) ===== -->
  <line x1="460" y1="420" x2="860" y2="420" stroke="#1f5fbf" stroke-width="4"/>
  <text x="660" y="404" font-size="22" text-anchor="middle" fill="#1f5fbf">3.3V 신호 · 직결</text>

  <!-- ===== 모듈 TXD(5V) → R1 → 노드 → GPIO27, 노드 → R2 → GND ===== -->
  <line x1="860" y1="500" x2="720" y2="500" stroke="#d9731a" stroke-width="4"/>
  <rect x="640" y="486" width="80" height="28" fill="#fff3e0" stroke="#d9731a" stroke-width="3"/>
  <text x="680" y="476" font-size="24" font-weight="bold" text-anchor="middle" fill="#d9731a">R1 2.2kΩ</text>
  <line x1="640" y1="500" x2="460" y2="500" stroke="#d9731a" stroke-width="4"/>
  <circle cx="560" cy="500" r="7" fill="#d9731a"/>
  <text x="520" y="534" font-size="22" text-anchor="middle" fill="#d9731a">≈ 3.1V</text>

  <line x1="560" y1="500" x2="560" y2="560" stroke="#d9731a" stroke-width="4"/>
  <rect x="546" y="560" width="28" height="80" fill="#fff3e0" stroke="#d9731a" stroke-width="3"/>
  <text x="586" y="606" font-size="24" font-weight="bold" fill="#d9731a">R2 3.3kΩ</text>
  <text x="586" y="634" font-size="18" fill="#a0521a">(GPIO27 ↔ GND)</text>
  <line x1="560" y1="640" x2="560" y2="950" stroke="#222" stroke-width="4"/>

  <!-- ===== RS485 변환 모듈 ===== -->
  <rect x="860" y="300" width="380" height="320" rx="14" fill="#f3f8ee" stroke="#4a7c2a" stroke-width="3"/>
  <text x="1050" y="340" font-size="24" font-weight="bold" text-anchor="middle" fill="#2f5a18">TTL ↔ RS485 자동 흐름제어 모듈</text>
  <text x="1050" y="370" font-size="21" text-anchor="middle" fill="#2f5a18">[SMG-A] SZH-CVBE-010 · MAX13487E</text>

  <circle cx="860" cy="420" r="8" fill="#1f5fbf"/>
  <text x="880" y="428" font-size="24" font-weight="bold" fill="#1f5fbf">RXD</text>
  <text x="940" y="428" font-size="19" fill="#555">(TTL 입력)</text>
  <circle cx="860" cy="500" r="8" fill="#d9731a"/>
  <text x="880" y="508" font-size="24" font-weight="bold" fill="#d9731a">TXD</text>
  <text x="940" y="508" font-size="19" fill="#555">(TTL 출력, 5V)</text>
  <text x="1050" y="465" font-size="19" text-anchor="middle" fill="#555">방향 전환 자동 · DE/RE 핀 없음</text>

  <circle cx="1240" cy="420" r="8" fill="#2e7d32"/>
  <text x="1222" y="428" font-size="24" font-weight="bold" text-anchor="end" fill="#2e7d32">A</text>
  <circle cx="1240" cy="500" r="8" fill="#2e7d32"/>
  <text x="1222" y="508" font-size="24" font-weight="bold" text-anchor="end" fill="#2e7d32">B</text>

  <text x="1050" y="562" font-size="20" text-anchor="middle" fill="#8a1c1c">R16(120Ω 종단) 열어 둠 = 끔</text>

  <circle cx="940" cy="620" r="8" fill="#c62828"/>
  <text x="940" y="600" font-size="24" font-weight="bold" text-anchor="middle" fill="#c62828">VCC</text>
  <circle cx="1160" cy="620" r="8" fill="#222"/>
  <text x="1160" y="600" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">GND</text>

  <!-- ===== RS485 A/B ===== -->
  <line x1="1240" y1="420" x2="1380" y2="420" stroke="#2e7d32" stroke-width="4"/>
  <line x1="1240" y1="500" x2="1380" y2="500" stroke="#2e7d32" stroke-width="4"/>
  <text x="1310" y="404" font-size="22" text-anchor="middle" fill="#2e7d32">A ↔ A</text>
  <text x="1310" y="484" font-size="22" text-anchor="middle" fill="#2e7d32">B ↔ B</text>
  <text x="1310" y="545" font-size="19" text-anchor="middle" fill="#555">응답 없으면</text>
  <text x="1310" y="570" font-size="19" text-anchor="middle" fill="#555">A/B 두 선 교체</text>

  <!-- ===== 센서 ===== -->
  <rect x="1380" y="300" width="300" height="320" rx="14" fill="#fdf6e8" stroke="#9a6b1f" stroke-width="3"/>
  <text x="1530" y="340" font-size="26" font-weight="bold" text-anchor="middle" fill="#6b4a12">토양 7종 센서</text>
  <text x="1530" y="370" font-size="21" text-anchor="middle" fill="#6b4a12">RS485 Modbus-RTU</text>
  <circle cx="1380" cy="420" r="8" fill="#2e7d32"/>
  <text x="1400" y="428" font-size="24" font-weight="bold" fill="#2e7d32">A</text>
  <circle cx="1380" cy="500" r="8" fill="#2e7d32"/>
  <text x="1400" y="508" font-size="24" font-weight="bold" fill="#2e7d32">B</text>
  <text x="1545" y="440" font-size="19" text-anchor="middle" fill="#555">주소 2 · 9600 8N1</text>
  <text x="1545" y="466" font-size="19" text-anchor="middle" fill="#555">온도·수분·EC·염분</text>
  <text x="1545" y="492" font-size="19" text-anchor="middle" fill="#555">N·P·K·pH (레지스터 0~7)</text>
  <text x="1530" y="536" font-size="19" text-anchor="middle" fill="#555">DC 3.3~24V (여기선 5V)</text>
  <text x="1530" y="560" font-size="19" text-anchor="middle" fill="#555">25mA · 최대 35mA</text>
  <circle cx="1440" cy="620" r="8" fill="#c62828"/>
  <text x="1440" y="600" font-size="24" font-weight="bold" text-anchor="middle" fill="#c62828">전원 +</text>
  <circle cx="1620" cy="620" r="8" fill="#222"/>
  <text x="1620" y="600" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">전원 −</text>

  <!-- ===== 전원 내려오는 선 ===== -->
  <line x1="200" y1="700" x2="200" y2="880" stroke="#c62828" stroke-width="4"/>
  <line x1="320" y1="700" x2="320" y2="950" stroke="#222" stroke-width="4"/>
  <line x1="940" y1="620" x2="940" y2="880" stroke="#c62828" stroke-width="4"/>
  <line x1="1160" y1="620" x2="1160" y2="950" stroke="#222" stroke-width="4"/>
  <line x1="1440" y1="620" x2="1440" y2="880" stroke="#c62828" stroke-width="4"/>
  <line x1="1620" y1="620" x2="1620" y2="950" stroke="#222" stroke-width="4"/>

  <!-- ===== 전원 레일 ===== -->
  <line x1="120" y1="880" x2="1640" y2="880" stroke="#c62828" stroke-width="6"/>
  <line x1="120" y1="950" x2="1640" y2="950" stroke="#222" stroke-width="6"/>
  <circle cx="200" cy="880" r="8" fill="#c62828"/>
  <circle cx="940" cy="880" r="8" fill="#c62828"/>
  <circle cx="1440" cy="880" r="8" fill="#c62828"/>
  <circle cx="320" cy="950" r="8" fill="#222"/>
  <circle cx="560" cy="950" r="8" fill="#222"/>
  <circle cx="1160" cy="950" r="8" fill="#222"/>
  <circle cx="1620" cy="950" r="8" fill="#222"/>
  <text x="1652" y="888" font-size="24" font-weight="bold" fill="#c62828">5V</text>
  <text x="1652" y="958" font-size="24" font-weight="bold" fill="#222">GND</text>
  <text x="120" y="992" font-size="20" fill="#444">5V 레일 = 센서 기판 5V (전력 기판 강압 모듈 출력 5.1~5.2V, 전원선 2가닥씩) · GND 레일 = 보드·모듈·센서 공통 접지 (한 점에서 묶음)</text>

  <!-- ===== 주의 ===== -->
  <rect x="60" y="1016" width="1600" height="190" rx="12" fill="#fafafa" stroke="#bbb" stroke-width="2"/>
  <text x="84" y="1050" font-size="24" font-weight="bold" fill="#8a1c1c">주의</text>
  <text x="84" y="1084" font-size="20" fill="#333">1. 모듈은 5V 로 급전 (MAX13487E 칩 규격 4.75~5.25V). 그래서 모듈 TXD 출력이 5V 라 R1·R2 분압 없이 GPIO27 에 직결하면 안 됨. GPIO17 → RXD 는 직결.</text>
  <text x="84" y="1116" font-size="20" fill="#333">2. 처음 연결: 분압을 넣기 전에 모듈을 3.3V 로 돌려 TXD/RXD 방향을 확인(바꿔 꽂아도 안전) → 통신이 되면 5V + 분압으로 전환, 이후엔 선을 바꿔 꽂지 않기.</text>
  <text x="84" y="1148" font-size="20" fill="#333">3. R16(120Ω 종단)은 열어 둠. 자동 방향 전환은 1 비트를 바이어스 저항이 끌어올리는 방식이라 짧은 버스에서 종단을 켜면 손해. 선이 수십 m 를 넘을 때만 잇기.</text>
  <text x="84" y="1180" font-size="20" fill="#333">4. 펌웨어: 주소 2 → 1 → 0 자동 탐색. 시리얼 b(상태·마지막 프레임) · b2(주소 지정) · bs(다시 탐색) · br(즉시 읽기). 첫 pH 는 삽입 뒤 5분 넘게 걸림(설명서).</text>
</svg>
