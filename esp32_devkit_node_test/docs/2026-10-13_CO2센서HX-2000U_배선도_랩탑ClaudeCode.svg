<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1230" viewBox="0 0 1720 1230" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect x="0" y="0" width="1720" height="1230" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="860" y="52" font-size="34" font-weight="bold" text-anchor="middle" fill="#111">스마트큐브 제어기 — CO2 센서 EXSEN HX-2000U 배선도</text>
  <text x="860" y="88" font-size="22" text-anchor="middle" fill="#555">2026-10-13 · 펌웨어 cube-devkit-1.5.0 (esp32_devkit_node_test) · 사용자 결정: UART1 TX GPIO32 / RX GPIO33</text>

  <!-- ===== ESP32 DevKitC ===== -->
  <rect x="60" y="140" width="400" height="560" rx="14" fill="#eef3fb" stroke="#2b4c7e" stroke-width="3"/>
  <text x="260" y="182" font-size="28" font-weight="bold" text-anchor="middle" fill="#1c3557">ESP32 DevKitC</text>
  <text x="260" y="212" font-size="22" text-anchor="middle" fill="#1c3557">WROOM-32D · "ESP32 Dev Module"</text>

  <text x="80" y="256" font-size="19" fill="#777">다른 핀 (이미 사용 중, 손대지 않음):</text>
  <text x="80" y="284" font-size="19" fill="#777">18 모터 · 16 LED · 21/22 I2C</text>
  <text x="80" y="312" font-size="19" fill="#777">25·26·34 배기팬 · 19·23·35 순환팬</text>
  <text x="80" y="340" font-size="19" fill="#777">17/27 RS485 (UART2) · 1/3 콘솔 (UART0)</text>
  <text x="80" y="368" font-size="19" fill="#777">남은 자유 출력 핀: 4·13·14</text>

  <!-- 우측 핀: GPIO32, GPIO33 -->
  <circle cx="460" cy="455" r="8" fill="#1f5fbf"/>
  <text x="440" y="463" font-size="24" font-weight="bold" text-anchor="end" fill="#1f5fbf">GPIO32 · UART1 TX</text>
  <circle cx="460" cy="500" r="8" fill="#d9731a"/>
  <text x="440" y="508" font-size="24" font-weight="bold" text-anchor="end" fill="#d9731a">GPIO33 · UART1 RX</text>
  <text x="440" y="536" font-size="18" text-anchor="end" fill="#777">(UART1 기본 핀 9/10 은 플래시라 재배정)</text>

  <!-- 하단 핀: 5V, GND -->
  <circle cx="200" cy="700" r="8" fill="#c62828"/>
  <text x="200" y="680" font-size="24" font-weight="bold" text-anchor="middle" fill="#c62828">5V (VIN)</text>
  <circle cx="320" cy="700" r="8" fill="#222"/>
  <text x="320" y="680" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">GND</text>
  <text x="260" y="648" font-size="18" text-anchor="middle" fill="#777">3V3 핀은 이 배선에서 쓰지 않음</text>

  <!-- ===== GPIO32 → 센서 4 Rx (3.3V 직결) ===== -->
  <line x1="460" y1="455" x2="1100" y2="455" stroke="#1f5fbf" stroke-width="4"/>
  <text x="780" y="439" font-size="22" text-anchor="middle" fill="#1f5fbf">3.3V 신호 · 직결</text>

  <!-- ===== 센서 3 Tx → (분압: Tx 가 5V 일 때만) → GPIO33 ===== -->
  <line x1="1100" y1="500" x2="800" y2="500" stroke="#d9731a" stroke-width="4"/>
  <rect x="600" y="470" width="340" height="220" rx="10" fill="none" stroke="#d9731a" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="720" y="486" width="80" height="28" fill="#fff3e0" stroke="#d9731a" stroke-width="3"/>
  <text x="760" y="540" font-size="24" font-weight="bold" text-anchor="middle" fill="#d9731a">R1 10kΩ</text>
  <line x1="720" y1="500" x2="460" y2="500" stroke="#d9731a" stroke-width="4"/>
  <circle cx="660" cy="500" r="7" fill="#d9731a"/>
  <text x="628" y="540" font-size="22" text-anchor="middle" fill="#d9731a">≈ 3.3V</text>

  <line x1="660" y1="500" x2="660" y2="560" stroke="#d9731a" stroke-width="4"/>
  <rect x="646" y="560" width="28" height="80" fill="#fff3e0" stroke="#d9731a" stroke-width="3"/>
  <text x="686" y="596" font-size="24" font-weight="bold" fill="#d9731a">R2 20kΩ</text>
  <text x="686" y="624" font-size="18" fill="#a0521a">(GPIO33 ↔ GND)</text>
  <line x1="660" y1="640" x2="660" y2="950" stroke="#222" stroke-width="4"/>
  <text x="770" y="672" font-size="18" font-weight="bold" text-anchor="middle" fill="#a0521a">점선 안은 Tx 가 5V 일 때만 · 3.3V 면 직결</text>

  <!-- ===== CO2 센서 ===== -->
  <rect x="1100" y="200" width="560" height="530" rx="14" fill="#fdf6e8" stroke="#9a6b1f" stroke-width="3"/>
  <text x="1380" y="240" font-size="26" font-weight="bold" text-anchor="middle" fill="#6b4a12">EXSEN HX-2000U CO2 센서</text>
  <text x="1380" y="268" font-size="21" text-anchor="middle" fill="#6b4a12">전기화학식 · UART 9600 8N1 · 400~5,000 ppm · 7핀 2.0mm 피치</text>

  <!-- 핀 7(위) ~ 1(아래): 시트 도면 순서 -->
  <circle cx="1100" cy="320" r="8" fill="#999"/>
  <text x="1120" y="328" font-size="24" font-weight="bold" fill="#999">7 NC</text>
  <circle cx="1100" cy="365" r="8" fill="#999"/>
  <text x="1120" y="373" font-size="24" font-weight="bold" fill="#999">6 NC</text>
  <circle cx="1100" cy="410" r="8" fill="#999"/>
  <text x="1120" y="418" font-size="24" font-weight="bold" fill="#999">5 RST</text>
  <text x="1210" y="418" font-size="19" fill="#777">미연결 (극성 시트에 없음 · GND 에 묶지 말 것)</text>
  <circle cx="1100" cy="455" r="8" fill="#1f5fbf"/>
  <text x="1120" y="463" font-size="24" font-weight="bold" fill="#1f5fbf">4 Rx</text>
  <text x="1210" y="463" font-size="19" fill="#555">(센서 입력 ← ESP32 TX)</text>
  <circle cx="1100" cy="500" r="8" fill="#d9731a"/>
  <text x="1120" y="508" font-size="24" font-weight="bold" fill="#d9731a">3 Tx</text>
  <text x="1210" y="508" font-size="19" fill="#555">(센서 출력 → ESP32 RX · 전압 측정 필요)</text>
  <circle cx="1100" cy="545" r="8" fill="#222"/>
  <text x="1120" y="553" font-size="24" font-weight="bold" fill="#222">2 GND</text>
  <circle cx="1100" cy="590" r="8" fill="#c62828"/>
  <text x="1120" y="598" font-size="24" font-weight="bold" fill="#c62828">1 VCC</text>
  <text x="1210" y="598" font-size="19" fill="#555">5V (4.5~5.5V) · 예열 중 최대 0.15A, 뒤 약 0.1W</text>

  <text x="1380" y="634" font-size="18" text-anchor="middle" fill="#555">커넥터 미장착: 2.0mm 핀헤더 또는 전선 직접 납땜</text>
  <text x="1380" y="660" font-size="18" text-anchor="middle" fill="#555">핀 1 은 열 맨 아래 (보드 실크 글자로 확인)</text>
  <text x="1380" y="686" font-size="18" text-anchor="middle" fill="#555">첫 응답 뒤 15분 예열 · 2일 연속 가동 뒤 자동 보정 안정</text>
  <text x="1380" y="712" font-size="18" text-anchor="middle" fill="#555">팬 바람이 직접 닿는 곳·펠티어 옆은 피할 것</text>

  <!-- ===== 센서 전원선: 1 VCC → 5V 레일, 2 GND → GND 레일 ===== -->
  <line x1="1100" y1="590" x2="1040" y2="590" stroke="#c62828" stroke-width="4"/>
  <line x1="1040" y1="590" x2="1040" y2="880" stroke="#c62828" stroke-width="4"/>
  <line x1="1100" y1="545" x2="1000" y2="545" stroke="#222" stroke-width="4"/>
  <line x1="1000" y1="545" x2="1000" y2="950" stroke="#222" stroke-width="4"/>

  <!-- ===== 보드 전원 내려오는 선 ===== -->
  <line x1="200" y1="700" x2="200" y2="880" stroke="#c62828" stroke-width="4"/>
  <line x1="320" y1="700" x2="320" y2="950" stroke="#222" stroke-width="4"/>

  <!-- ===== 전원 레일 ===== -->
  <line x1="120" y1="880" x2="1640" y2="880" stroke="#c62828" stroke-width="6"/>
  <line x1="120" y1="950" x2="1640" y2="950" stroke="#222" stroke-width="6"/>
  <circle cx="200" cy="880" r="8" fill="#c62828"/>
  <circle cx="1040" cy="880" r="8" fill="#c62828"/>
  <circle cx="320" cy="950" r="8" fill="#222"/>
  <circle cx="660" cy="950" r="8" fill="#222"/>
  <circle cx="1000" cy="950" r="8" fill="#222"/>
  <text x="1652" y="888" font-size="24" font-weight="bold" fill="#c62828">5V</text>
  <text x="1652" y="958" font-size="24" font-weight="bold" fill="#222">GND</text>
  <text x="120" y="992" font-size="20" fill="#444">5V 레일 = 센서 기판 5V (전력 기판 강압 모듈 출력) · GND 레일 = 보드·센서 공통 접지 (한 점에서 묶음) · 점(●)이 있는 곳만 연결, 그냥 지나는 선은 미연결</text>

  <!-- ===== 주의 ===== -->
  <rect x="60" y="1016" width="1600" height="190" rx="12" fill="#fafafa" stroke="#bbb" stroke-width="2"/>
  <text x="84" y="1050" font-size="24" font-weight="bold" fill="#8a1c1c">주의</text>
  <text x="84" y="1084" font-size="20" fill="#333">1. 시트에 UART 전압이 없음. 센서에 5V·GND 만 넣고 3 Tx–GND 전압을 잰다 → 약 3.3V 면 GPIO33 에 직결, 약 5V 면 R1 10kΩ 직렬 + R2 20kΩ 접지(5V × 20/30 = 3.3V).</text>
  <text x="84" y="1116" font-size="20" fill="#333">2. GPIO32 → 4 Rx 는 3.3V 직결(응답이 없으면 그때 레벨 변환 검토). 센서 VCC 는 5V 레일에서, 보드 3V3 핀에 연결 금지. 예열 중 0.15A 라 5V 레일 여유 확인.</text>
  <text x="84" y="1148" font-size="20" fill="#333">3. 커넥터가 없고 구멍이 2.0mm 피치라 2.54mm 점퍼·핀헤더가 안 맞음. 2.0mm 핀헤더 납땜 또는 전선 직접 납땜. 5 RST 는 극성 미기재라 미연결.</text>
  <text x="84" y="1180" font-size="20" fill="#333">4. 펌웨어: 5초마다 요청 42 4D E3 00 00 01 72 → 응답 12바이트(체크섬 검사). 첫 응답 뒤 15분 예열 = co2_ppm null. 시리얼 co(상태·프레임) · cor(즉시 읽기).</text>
</svg>
