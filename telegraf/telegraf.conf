[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "jetson"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "smartcube"
  bucket = "sensors"

# ESP32 -> MQTT(JSON) -> InfluxDB. topic 예: smartcube/SC-01/ctrl/data
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["smartcube/#"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  client_id = "telegraf"
  qos = 0
  data_format = "json"
  name_override = "mqtt"
  topic_tag = "topic"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "smartcube/+/+/+"
    tags = "_/cube/_/kind"
