[project]
name = "crop-monitor"
version = "0.1.0"
description = "천장 스테레오 카메라 기반 작물 생장 단계·이상 감지·높이 측정 LangGraph 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
    "pillow",
    # 잎 이상 모듈 원본이 8.4.198 로 고정 (서버 잎 탐지 결과 재현). 생장 단계 모듈은 8.4.0 이상이면 됨
    "ultralytics==8.4.198",
    # Claude API (생장 단계 검수·누락 추가, 잎 이상 VLM 재확인). 키는 secrets/ANTHROPIC_API_KEY
    "anthropic",
]

[project.optional-dependencies]
# 잎 이상 VLM 재확인을 Qwen2.5-VL(로컬 GPU)로 할 때
qwen = ["transformers", "accelerate"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crop_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: 실제 모델로 그래프 전체 실행 (CPU 1분 안팎). 제외: -m \"not slow\""]
filterwarnings = ["ignore::UserWarning"]
